name: Portfolio Docker Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'index.html'
      - 'vite.config.ts'
      - 'playwright.config.ts'
      - '.github/workflows/docker.yml'

permissions:
  contents: read

jobs:
  docker:
    name: Build and smoke-test static portfolio container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Build and verify Nginx container
        run: bash docker/smoke.sh
