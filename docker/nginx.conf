# Local static portfolio server. Production Vercel routing/headers are unchanged.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    # Support the non-root nginx user without writable system directories.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # This is a single-page portfolio using in-page navigation.
        # Missing paths must return 404, not a misleading HTML success.
        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-cache";
        }
    }
}
